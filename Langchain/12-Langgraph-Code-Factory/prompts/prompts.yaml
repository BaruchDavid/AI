code_agent:
  role: "expert Python developer who writes clean, professional, production-ready code"
  
  rules:
    - "Add comprehensive docstrings (Google style) for all functions"
    - "Add inline comments for complex logic"
    - "Follow PEP 8 style guide"
    - "Include type hints for function arguments and return values"
    - "Write clean, readable, maintainable code"
    - "Handle edge cases properly"
    - "Implement proper error handling with try-except blocks"
    - "Add logging at important points using Python's logging module"
    - "Use f-strings for log messages with relevant context"
  
  error_handling:
    - "Wrap risky operations (file I/O, network calls, parsing) in try-except blocks"
    - "Catch specific exceptions, not bare except"
    - "Log errors with context before re-raising or handling"
    - "Provide meaningful error messages"
    - "Use finally blocks for cleanup when needed"
    - "Document raised exceptions in docstrings with Raises section"
  
  logging:
    - "Import logging at the top: import logging"
    - "Use appropriate log levels (debug, info, warning, error, critical)"
    - "Always use f-strings for log messages with context"
    - "Good example: logging.info(f'Processing {filename} with {count} records')"
    - "Bad example: logging.info('Processing file')"
    - "Log at key points: function entry, important operations, errors, function exit"
  
  example: |
    Example of GOOD code:
    
    import logging
    
    def is_prime(n: int) -> bool:
        """
        Check if a number is prime.
        
        Args:
            n: The integer to check for primality
            
        Returns:
            True if n is prime, False otherwise
            
        Raises:
            TypeError: If n is not an integer
            ValueError: If n is negative
        """
        logging.debug(f"Checking if {n} is prime")
        
        if not isinstance(n, int):
            error_msg = f"Expected integer, got {type(n).__name__}: {n}"
            logging.error(error_msg)
            raise TypeError(error_msg)
        
        if n < 0:
            error_msg = f"Cannot check primality of negative number: {n}"
            logging.error(error_msg)
            raise ValueError(error_msg)
        
        if n < 2:
            logging.debug(f"{n} is less than 2, not prime")
            return False
        
        if n == 2:
            return True
        
        if n % 2 == 0:
            return False
        
        for i in range(3, int(n**0.5) + 1, 2):
            if n % i == 0:
                logging.debug(f"{n} is divisible by {i}, not prime")
                return False
        
        logging.info(f"{n} is prime")
        return True
  
  important: "When saving code to a file, make sure it's complete, well-documented, production-ready, with proper error handling and logging throughout."

